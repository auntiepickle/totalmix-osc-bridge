<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>mobile preview</title>
<style>
  body { margin: 0; background: #333; display: flex; gap: 20px; padding: 20px; align-items: flex-start; }
  .frame { border: 2px solid #666; border-radius: 12px; overflow: hidden; }
  iframe { width: 390px; height: 844px; border: 0; display: block; }
  .lbl { color: #ccc; font: 12px monospace; text-align: center; padding: 4px; }
</style></head>
<body>
  <!-- Dev harness: true 390px viewport for responsive/skin review.
       Media queries inside the iframe respond to the IFRAME width. -->
  <div>
    <div class="lbl">390 × 844</div>
    <div class="frame"><iframe id="mob" src="index.html"></iframe></div>
  </div>
</body>
</html>

# TotalMix OSC Bridge - docker compose example
#
# 1. create .env next to this file - at least:  OSC_IP=<TotalMix PC>  OSC_TRANSPORT=global
#    (ENABLE_MQTT=false if you have no broker; all variables: docs/setup.md#environment-variables)
# 2. either run it as is:      docker compose -f docker-compose.example.yml up -d --build
#    or copy it first:         cp docker-compose.example.yml docker-compose.yml && docker compose up -d --build
#
# Updates are `git pull` + `docker compose restart` (the checkout is bind-mounted);
# rebuild only when requirements.txt, the Dockerfile or the web UI's Tailwind classes change.
services:
  totalmix-osc-bridge:
    build: .
    container_name: totalmix-osc-bridge
    restart: unless-stopped
    env_file:
      - .env
    # Host networking: TotalMix sends OSC feedback to this host on UDP 9001 / 9002
    # and LAN auto-discovery answers broadcasts on UDP 8088, so no port mappings
    # are needed (compose also rejects `ports:` together with network_mode: host).
    network_mode: host
    volumes:
      - .:/app
      # Optional shared config dir - a ufx2_snapshot_map.json here is authoritative
      # and hot-reloads without a restart:
      # - /path/on/your/nas/totalmix:/app/config:ro
